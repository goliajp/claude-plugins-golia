# An alternative message table for the close planner self-test: the same keys
# as the kernel's English table (close_lib.py MESSAGES) with different words,
# so the test can tell a verdict rendered from this table from the default.
# One `key=value` per line; the value is taken verbatim after the first `=`;
# `{name}` fields are filled by the kernel. Keys not listed keep the kernel text.
form_next=open the next round now
form_sync_then_next=finish first, then open
form_next_async=open now, run beside
form_sync_then_next_async=finish the blocking part, open, keep running beside
decision_run=RUN
decision_carry=CARRY
decision_current=AT HEAD
mode_sync=blocking
mode_async=beside
h_changes=## 1 Changes in this rotation
h_decision=## 2 Decision per check
h_release=## 4 Handover form
h_results=## 3 Readings
results_amber=Still to attribute (amber): {items}
status_pending=not at HEAD yet
flag_amber=AMBER
